<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>视频嗅探下载器</title>
  <!-- 兜底基础样式，避免热更新样式加载前抖动 -->
  <style>
    body { width: 440px; margin: 0; font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    #boot-error { padding: 24px; font-size: 12px; color: #b3261e; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="dot"></span>
      <strong>视频嗅探下载器</strong>
      <span id="ver" class="ver">v—</span>
    </div>
    <div class="tools">
      <button id="btn-diag" class="ghost" title="看页面到底有没有拿到完整视频">诊断</button>
      <button id="btn-refresh" class="ghost" title="重新读取">刷新</button>
      <button id="btn-clear" class="ghost" title="清空本页记录">清空</button>
    </div>
  </header>

  <div id="diag" class="diag hidden">
    <div class="diag-head">
      <strong id="diag-title">诊断</strong>
      <span class="grow"></span>
      <button id="btn-diag-copy" class="mini">复制报告</button>
      <button id="btn-diag-close" class="mini">关闭</button>
    </div>
    <div id="diag-body" class="diag-body"></div>
  </div>

  <div id="update-bar" class="update hidden">
    <span id="update-text">后台逻辑已更新</span>
    <button id="btn-apply" class="mini">立即应用</button>
  </div>

  <div id="drm-banner" class="banner hidden">
    <strong>检测到受保护内容</strong>
    <p>该页面使用了 DRM（Widevine / FairPlay / PlayReady）。这类内容受技术保护措施约束，本扩展不提供解析或下载，请通过官方渠道观看或购买。</p>
  </div>

  <div class="scope" id="scope">
    <button class="scope-btn active" data-s="video">视频 <i id="cnt-video">0</i></button>
    <button class="scope-btn" data-s="image">图片 <i id="cnt-image">0</i></button>
  </div>

  <div id="now-bar" class="now hidden">
    <span class="now-dot"></span>
    <span id="now-text" class="now-text"></span>
    <button id="btn-now" class="mini">只看这条</button>
  </div>

  <div class="filters" id="filters-video">
    <button class="chip active" data-f="all">全部 <i>0</i></button>
    <button class="chip" data-f="current">当前播放 <i>0</i></button>
    <button class="chip" data-f="hls">HLS <i>0</i></button>
    <button class="chip" data-f="file">直链 <i>0</i></button>
    <button class="chip" data-f="seg">分片 <i>0</i></button>
  </div>

  <div class="filters hidden" id="filters-image">
    <button class="chip active" data-f="all">全部 <i>0</i></button>
    <button class="chip" data-f="vis">页面可见 <i>0</i></button>
    <button class="chip" data-f="jpg">JPEG <i>0</i></button>
    <button class="chip" data-f="png">PNG <i>0</i></button>
    <button class="chip" data-f="webp">WebP <i>0</i></button>
    <button class="chip" data-f="gif">GIF <i>0</i></button>
  </div>

  <div id="hint" class="hint hidden"></div>

  <div id="empty" class="empty">
    <p class="empty-title">还没嗅探到视频</p>
    <p class="empty-tip">在页面上点击播放，让视频真正开始加载，再点右上角「刷新」。</p>
  </div>

  <main id="list" class="list"></main>

  <footer class="bar">
    <label class="selall"><input type="checkbox" id="chk-all" /> 全选</label>
    <button id="btn-smart" class="ghost" title="自动选择：所有 HLS + 每个域名最大的直链">智能选择</button>
    <span class="grow"></span>
    <button id="btn-stop" class="btn stop hidden" title="停止所有正在进行的下载与网络请求">全部停止</button>
    <button id="btn-dl" class="btn" disabled>下载选中</button>
  </footer>

  <div id="page-host" class="foot">—</div>

  <script src="boot.js"></script>
</body>
</html>
